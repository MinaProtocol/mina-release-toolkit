[package]
name = "mina-json-bytes"
version = "0.1.0"
edition = "2021"
authors = ["Mina Protocol Team"]
description = "Carry bytes that are not valid UTF-8 through jq, which replaces each such byte with U+FFFD."
license = "Apache-2.0"

[[bin]]
name = "mina-json-bytes"
path = "src/main.rs"

[lib]
name = "mina_json_bytes"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tempfile = "3"
thiserror = "1.0"
