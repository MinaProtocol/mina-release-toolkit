# Project registry for mina-ops.
#
# This file is also compiled into the binary as the built-in default, so
# mina-ops works with no configuration at all. Copy it to
# ~/.config/mina-ops/projects.yaml to change it, or point MINA_OPS_CONFIG at
# your own copy.
#
# Keep internal hosts out of this file. It lives in a public repository. Put
# anything that is not already public in your own copy.

projects:
  mina:
    repo: MinaProtocol/mina
    buildkite:
      org: o-1-labs-2
      # Pipelines listed first are shown first. Builds from pipelines not
      # listed here are still reported.
      pipelines:
        - mina-o-1-labs
        - mina-mainline-branches-nightlies
        - mina-pr-gating
      # Defaults for `mina-ops nightly`.
      nightly_pipeline: mina-mainline-branches-nightlies
      nightly_branch: develop
      # Pipeline the hardfork package-generation form triggers.
      hardfork_pipeline: hardfork-package-generation-new
    apt:
      region: us-west-2
    docker:
      gcr: gcr.io/o1labs-192920
      docker_io: docker.io/minaprotocol
    defaults:
      channel: unstable
      artifacts:
        - mina-daemon
        - mina-archive
        - mina-rosetta
        - mina-logproc
      codenames:
        - bullseye
        - bookworm
        - noble
      # Build profile: null, "lightnet" or "instrumented".
      profile: null
    # Where the CI cache lives. Mina's pipelines put .deb files here rather
    # than in Buildkite artifacts, under <root>/<build-uuid>/debians/...
    #
    # Left unset on purpose: this repository is public. Set it in
    # ~/.config/mina-ops/projects.yaml, or through the environment:
    #
    #   MINA_OPS_CACHE_ROOT       a mounted path, as CI has
    #   MINA_OPS_CACHE_SSH_HOST   host, user, root (and optional port, key)
    #   MINA_OPS_CACHE_SSH_USER
    #   MINA_OPS_CACHE_SSH_ROOT
    #   MINA_OPS_CACHE_SSH_PORT
    #   MINA_OPS_CACHE_SSH_KEY
    #
    # cache:
    #   root: /var/storagebox
    #   ssh:
    #     host: example.your-storagebox.de
    #     user: u000000
    #     port: 23
    #     key: ~/.ssh/storagebox.key
    #     root: /home/generic/cache-root
