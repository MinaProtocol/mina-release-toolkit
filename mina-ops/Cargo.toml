[package]
name = "mina-ops"
version = "0.1.0"
edition = "2021"
authors = ["Mina Protocol Team"]
description = "Read-only inventory across Mina CI, artifact and release systems, keyed by commit"
license = "Apache-2.0"
repository = "https://github.com/MinaProtocol/mina-release-toolkit"
keywords = ["buildkite", "ci", "release", "inventory"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "mina-ops"
path = "src/main.rs"

[lib]
name = "mina_ops"
path = "src/lib.rs"

[dependencies]
# Package naming, version and docker-tag conventions are owned by
# release-manager. They are reused rather than copied so the two tools cannot
# disagree about what "published" means.
release-manager = { path = "../release-manager" }

clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
colored = "2"

[dependencies.reqwest]
version = "0.11"
# rustls rather than native-tls, matching release-manager, so static musl
# builds keep working.
default-features = false
features = ["json", "rustls-tls"]

[dev-dependencies]
wiremock = "0.6"
pretty_assertions = "1.4"
tempfile = "3"
