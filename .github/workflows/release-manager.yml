name: Release Manager CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'release-manager/**'
      - '.github/workflows/release-manager.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'release-manager/**'
      - '.github/workflows/release-manager.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    # submodules: the integration tests run against the deb-s3 in deb-s3/,
    # which is the build we ship. See "Install integration test deps" below.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: release-manager
        key: ${{ matrix.os }}-${{ matrix.rust }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openssl pkg-config

    - name: Check formatting
      run: |
        cd release-manager
        cargo fmt --all -- --check

    - name: Run Clippy
      run: |
        cd release-manager
        cargo clippy --all-targets --all-features

    - name: Run tests
      run: |
        cd release-manager
        cargo test --verbose

    # Integration tests need Docker (for MinIO), deb-s3, dpkg-deb and aws on
    # PATH. GitHub-hosted Ubuntu runners already provide all but deb-s3.
    #
    # deb-s3 is built from the submodule, NOT `gem install deb-s3`. The
    # rubygems release is a different project state: it does not have the
    # `exist` subcommand the publish verification uses, so the tests were
    # exercising a deb-s3 that this repository never ships. Building the
    # pinned fork is also what packaging/Dockerfile does, so CI and the
    # published image agree.
    - name: Install integration test deps (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        cd deb-s3
        gem build deb-s3.gemspec
        sudo gem install --no-document ./deb-s3-*.gem
        deb-s3 help | grep -q ' exist ' || { echo "deb-s3 has no exist subcommand"; exit 1; }

    - name: Run integration tests (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        cd release-manager
        cargo test --features integration-test --verbose

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: release-manager

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev

    - name: Build release binary
      run: |
        cd release-manager
        cargo build --release
